[workspace]
members = [
    "crates/hoshi-core",
    "crates/hoshi-tui",
    "crates/hoshi-bridge",
    "crates/hoshi-author",
]
default-members = [
    "crates/hoshi-core",
    "crates/hoshi-tui",
    "crates/hoshi-bridge",
    "crates/hoshi-author",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/Sannrox/hoshi"
publish = false

[workspace.dependencies]
hoshi-core = { version = "0.1.0", path = "crates/hoshi-core" }
hoshi-bridge = { version = "0.1.0", path = "crates/hoshi-bridge" }

# Dependencies build without debug info in dev and test builds: backtraces
# and debuggers keep full detail for workspace crates, and build directories
# stay a fraction of the size.
[profile.dev.package."*"]
debug = false
