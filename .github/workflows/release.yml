name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  HOSHI_RELEASE_PUBLIC_KEY: ${{ vars.HOSHI_RELEASE_PUBLIC_KEY }}

jobs:
  verify-tag:
    name: Tag matches crate version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check tag
        run: bash scripts/check-release-tag.sh "${GITHUB_REF_NAME}"

  build:
    name: ${{ matrix.target }}
    needs: verify-tag
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Oldest supported Ubuntu LTS: its glibc is the floor for the Linux binaries and .debs.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact: hoshi-x86_64-unknown-linux-gnu
            native: "true"
            linux_state: "true"
            deb_arch: amd64
          - os: ubuntu-22.04
            target: aarch64-unknown-linux-gnu
            artifact: hoshi-aarch64-unknown-linux-gnu
            native: "false"
            linux_state: "false"
            cross: "true"
            deb_arch: arm64
          - os: macos-13
            target: x86_64-apple-darwin
            artifact: hoshi-x86_64-apple-darwin
            native: "true"
            linux_state: "false"
          - os: macos-14
            target: aarch64-apple-darwin
            artifact: hoshi-aarch64-apple-darwin
            native: "true"
            linux_state: "false"
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: hoshi-x86_64-pc-windows-msvc
            ext: .exe
            native: "true"
            linux_state: "false"
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          targets: ${{ matrix.target }}
      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - name: Cross linker (Linux aarch64)
        if: matrix.cross == 'true'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu qemu-user-static
      - name: Build
        if: matrix.cross != 'true'
        run: cargo build --locked --release --target ${{ matrix.target }} -p hoshi --bin hoshi
      - name: Build (cross)
        if: matrix.cross == 'true'
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo build --locked --release --target ${{ matrix.target }} -p hoshi --bin hoshi
      - name: Smoke --version
        shell: bash
        env:
          BIN: target/${{ matrix.target }}/release/hoshi${{ matrix.ext }}
        run: |
          set -euo pipefail
          want="hoshi ${GITHUB_REF_NAME#v}"
          if [ "${{ matrix.native }}" = "true" ]; then
            out="$("${BIN}" --version)"
          else
            # Cross libc lives under /usr/aarch64-linux-gnu; qemu prepends -L
            # to the ELF interpreter path /lib/ld-linux-aarch64.so.1.
            out="$(qemu-aarch64-static -L /usr/aarch64-linux-gnu "${BIN}" --version)"
          fi
          printf '%s\n' "${out}"
          printf '%s\n' "${out}" | grep -F "${want}"
      - name: Headless state
        if: matrix.linux_state == 'true'
        shell: bash
        run: |
          set -euo pipefail
          bin="target/${{ matrix.target }}/release/hoshi"
          tmp="$(mktemp "${RUNNER_TEMP}/hoshi-smoke-XXXXXX.sqlite")"
          "${bin}" --save "${tmp}" --seed 1 state
          rm -f "${tmp}" "${tmp}.lock"
      - name: Stage artifact
        shell: bash
        run: |
          mkdir -p dist
          src="target/${{ matrix.target }}/release/hoshi${{ matrix.ext }}"
          dest="dist/${{ matrix.artifact }}${{ matrix.ext }}"
          cp "${src}" "${dest}"
      - name: Debian package
        if: matrix.deb_arch != ''
        run: bash scripts/build-deb.sh "${GITHUB_REF_NAME}" "${{ matrix.deb_arch }}" "target/${{ matrix.target }}/release/hoshi" dist
      - name: Smoke .deb install
        if: matrix.deb_arch == 'amd64'
        run: |
          set -euo pipefail
          deb="dist/hoshi_${GITHUB_REF_NAME#v}_amd64.deb"
          dpkg-deb --info "${deb}"
          sudo apt-get install -y "./${deb}"
          /usr/bin/hoshi --version | grep -F "hoshi ${GITHUB_REF_NAME#v}"
          sudo apt-get remove -y hoshi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/${{ matrix.artifact }}${{ matrix.ext }}
            dist/*.deb
          if-no-files-found: error

  release:
    needs: [verify-tag, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Stage command reference
        run: cp docs/generated/hoshi.* dist/
      - name: Checksums
        working-directory: dist
        run: |
          set -euo pipefail
          sha256sum hoshi-* hoshi_*.deb hoshi.1 hoshi.bash hoshi.zsh hoshi.fish | tee SHA256SUMS
      - name: Release notes
        run: |
          set -euo pipefail
          bash scripts/release-notes.sh "${GITHUB_REF_NAME}" > dist/RELEASE_NOTES.md
          cat dist/RELEASE_NOTES.md
      - name: Homebrew formula
        run: bash scripts/homebrew-formula.sh "${GITHUB_REF_NAME}" dist
      - name: Sign release metadata and checksums
        env:
          HOSHI_RELEASE_SIGNING_KEY: ${{ secrets.HOSHI_RELEASE_SIGNING_KEY }}
          HOSHI_RELEASE_NOTE: ${{ vars.HOSHI_RELEASE_NOTE }}
        run: python3 scripts/sign-release-metadata.py --dist dist --version "${GITHUB_REF_NAME#v}" --channel stable --note "${HOSHI_RELEASE_NOTE}" --version-output "hoshi ${GITHUB_REF_NAME#v}"
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/publish-release.sh "${GITHUB_REF_NAME}" "hoshi ${GITHUB_REF_NAME}" dist/RELEASE_NOTES.md stable
      - name: Publish latest metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish-release-metadata.py dist/latest.json
      - name: Homebrew tap
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${HOMEBREW_TAP_TOKEN:-}" ]; then
            echo "HOMEBREW_TAP_TOKEN unset; formula attached to the GitHub Release as hoshi.rb"
            exit 0
          fi
          git clone --depth 1 "https://github.com/Sannrox/homebrew-tap.git" tap
          mkdir -p tap/Formula
          cp dist/hoshi.rb tap/Formula/hoshi.rb
          git -C tap config user.name "github-actions[bot]"
          git -C tap config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C tap add Formula/hoshi.rb
          if git -C tap diff --cached --quiet; then
            echo "tap formula already at ${GITHUB_REF_NAME}"
            exit 0
          fi
          git -C tap commit -m "hoshi ${GITHUB_REF_NAME#v}"
          git -C tap push "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/Sannrox/homebrew-tap.git" HEAD:main
