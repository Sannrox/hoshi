name: Nightly

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nightly
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  HOSHI_RELEASE_PUBLIC_KEY: ${{ vars.HOSHI_RELEASE_PUBLIC_KEY }}

jobs:
  plan:
    name: Plan
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.plan.outputs.build }}
      version: ${{ steps.plan.outputs.version }}
      label: ${{ steps.plan.outputs.label }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - id: plan
        env:
          MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          set -euo pipefail
          prev="$(git ls-remote origin refs/tags/nightly | cut -f1)"
          if [ "${prev}" = "${GITHUB_SHA}" ] && [ "${MANUAL}" != "true" ]; then
            echo "nightly already at ${GITHUB_SHA}"
            echo "build=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          base="$(sed -n '/^\[workspace\.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)"
          stamp="$(date -u +%Y%m%d%H%M)"
          short="${GITHUB_SHA::7}"
          {
            echo "build=true"
            echo "version=v${base}~nightly.${stamp}.g${short}"
            echo "label=nightly ${stamp} ${short}"
          } >> "${GITHUB_OUTPUT}"

  build:
    name: ${{ matrix.target }}
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            deb_arch: amd64
            native: "true"
          - target: aarch64-unknown-linux-gnu
            deb_arch: arm64
            native: "false"
    env:
      HOSHI_BUILD: ${{ needs.plan.outputs.label }}
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.97.1
          targets: ${{ matrix.target }}
      - name: Cache dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: nightly-${{ matrix.target }}
      - name: Cross linker (Linux aarch64)
        if: matrix.native != 'true'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu qemu-user-static
      - name: Set release identity
        run: echo "HOSHI_RELEASE_VERSION=${VERSION#v}" | sed 's/~nightly/-nightly/' >> "${GITHUB_ENV}"
      - name: Build
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo build --locked --release --target ${{ matrix.target }} -p hoshi --bin hoshi --features ui
      - name: Smoke --version
        run: |
          set -euo pipefail
          bin="target/${{ matrix.target }}/release/hoshi"
          if [ "${{ matrix.native }}" = "true" ]; then
            out="$("${bin}" --version)"
          else
            # Cross libc lives under /usr/aarch64-linux-gnu; qemu prepends -L
            # to the ELF interpreter path /lib/ld-linux-aarch64.so.1.
            out="$(qemu-aarch64-static -L /usr/aarch64-linux-gnu "${bin}" --version)"
          fi
          printf '%s\n' "${out}"
          printf '%s\n' "${out}" | grep -F "(${HOSHI_BUILD})"
      - name: Headless state
        if: matrix.native == 'true'
        run: |
          set -euo pipefail
          bin="target/${{ matrix.target }}/release/hoshi"
          tmp="$(mktemp "${RUNNER_TEMP}/hoshi-smoke-XXXXXX.sqlite")"
          "${bin}" --save "${tmp}" --seed 1 state
          rm -f "${tmp}" "${tmp}.lock"
      - name: Stage artifacts
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/hoshi" "dist/hoshi-${{ matrix.target }}"
          bash scripts/build-deb.sh "${VERSION}" "${{ matrix.deb_arch }}" "target/${{ matrix.target }}/release/hoshi" dist
      - name: Smoke .deb install
        if: matrix.native == 'true'
        run: |
          set -euo pipefail
          deb="$(ls dist/hoshi_*_amd64.deb)"
          dpkg-deb --info "${deb}"
          sudo apt-get install -y "./${deb}"
          /usr/bin/hoshi --version | grep -F "(${HOSHI_BUILD})"
          sudo apt-get remove -y hoshi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nightly-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish
    needs: [plan, build]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.plan.outputs.version }}
      HOSHI_BUILD: ${{ needs.plan.outputs.label }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          pattern: nightly-*
          merge-multiple: true
      - name: Stage command reference
        run: cp docs/generated/hoshi.* dist/
      - name: Checksums
        working-directory: dist
        run: sha256sum hoshi-* hoshi_*.deb hoshi.1 hoshi.bash hoshi.zsh hoshi.fish | tee SHA256SUMS
      - name: Release notes
        run: |
          set -euo pipefail
          cat > notes.md << EOF
          Automated build of \`main\` at ${GITHUB_SHA}. Not a release: expect bugs.

          Ubuntu 22.04+:

          \`\`\`sh
          curl -fsSL https://raw.githubusercontent.com/${GH_REPO}/main/scripts/install.sh | HOSHI_CHANNEL=nightly sh
          \`\`\`

          Package version \`${VERSION#v}\`. A nightly can migrate your save to a newer schema;
          stable releases older than that schema refuse to open it. Back up
          \`~/.local/share/hoshi/\` before switching between channels.
          EOF
      - name: Sign release metadata and checksums
        env:
          HOSHI_RELEASE_SIGNING_KEY: ${{ secrets.HOSHI_RELEASE_SIGNING_KEY }}
          HOSHI_RELEASE_NOTE: ${{ vars.HOSHI_RELEASE_NOTE }}
        run: |
          version="${VERSION#v}"
          version="${version/~nightly/-nightly}"
          python3 scripts/sign-release-metadata.py --dist dist --version "${version}" --channel nightly --note "${HOSHI_RELEASE_NOTE}" --version-output "hoshi ${version} (${HOSHI_BUILD})"
      - name: Retain versioned nightly assets
        run: |
          version="${VERSION#v}"
          version="${version/~nightly/-nightly}"
          bash scripts/publish-release.sh "v${version}" "hoshi ${version}" notes.md nightly
      - name: Replace nightly release
        run: |
          set -euo pipefail
          if gh release view nightly > /dev/null 2>&1; then
            gh release delete nightly --cleanup-tag --yes
          fi
          if gh api "repos/${GH_REPO}/git/ref/tags/nightly" > /dev/null 2>&1; then
            gh api -X DELETE "repos/${GH_REPO}/git/refs/tags/nightly"
          fi
          gh release create nightly dist/* \
            --prerelease --latest=false \
            --target "${GITHUB_SHA}" \
            --title "hoshi nightly ${VERSION#v}" \
            --notes-file notes.md
      - name: Publish latest metadata
        run: python3 scripts/publish-release-metadata.py dist/latest.json
