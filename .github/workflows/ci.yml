name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "27 3 * * 1"

env:
  CARGO_TERM_COLOR: always

# A new push to a pull request cancels its previous run; other events run
# every commit. The workflow name keeps workflows from cancelling each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.97.1
      - name: Cache dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Portrait asset budget
        run: bash scripts/check-portrait-assets.sh
      - name: Drafts stay out of the game content index
        run: bash scripts/check-drafts-unshipped.sh
      - name: Build
        run: cargo build --locked --workspace --all-targets
      - name: Test
        run: cargo test --locked --workspace

  # Each feature set compiles on its own, so each runs as its own job, in
  # parallel with Build & Test. All three are required checks.
  feature-tests:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Mikura backend
            run: cargo test --locked -p hoshi-storage --features mikura
          - name: Chisei backend
            run: |
              cargo test --locked -p hoshi-storage --features chisei
              cargo test --locked -p hoshi --features chisei
          - name: Embedded web client
            run: cargo test --locked -p hoshi --features ui --bin hoshi -- web_ui ui_pin serve::tests::ui_ serve::tests::root_and_ui
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}
      - name: ${{ matrix.name }}
        run: ${{ matrix.run }}

  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.97.1
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.97.1
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo clippy --locked -p hoshi-storage --features mikura --all-targets -- -D warnings
      - run: cargo clippy --locked -p hoshi-storage --features chisei --all-targets -- -D warnings
      - run: cargo clippy --locked -p hoshi --features chisei --all-targets -- -D warnings
      - run: cargo clippy --locked -p hoshi --features ui --all-targets -- -D warnings

  workflow-skills:
    name: Workflow Skills
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: bash scripts/validate-workflow-skills.sh
      - run: python3 scripts/test-release-metadata.py

  self-play:
    name: Self-play
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.97.1
      - name: Cache dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: PR sample
        if: github.event_name != 'schedule'
        run: cargo run --locked -p hoshi --bin hoshi -- --self-play self-play --matrix pr --bots
      - name: Nightly matrix
        if: github.event_name == 'schedule'
        run: cargo run --locked -p hoshi --bin hoshi -- --self-play self-play --matrix nightly --bots
