name: Feature request
description: Propose a focused capability or improvement.
title: "feat: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem needs to be solved?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe observable behavior rather than only an implementation.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance evidence
      description: What observable examples, tests, or measurements will demonstrate that the outcome is complete?
    validations:
      required: true
  - type: textarea
    id: non_goals
    attributes:
      label: Non-goals
      description: What related behavior is intentionally outside this request?
  - type: textarea
    id: realism
    attributes:
      label: Realism and domain
      description: Physics and maths follow docs/realism.md (energy, mass, travel, heat, combat and prices). Species, factions and story stay fictional. Name the object types, links and core actions. If the numbers skip physics, say which simplification in that file you are using, or propose adding one.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: How is the problem handled today, and what tradeoffs did you consider?
  - type: dropdown
    id: boundary
    attributes:
      label: Primary area
      options:
        - Core game rules and state
        - Terminal UI
        - Agent and GitHub bridge
        - Balance
        - Shared server
        - Documentation
        - Unsure
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Compatibility and risk
      description: Note contract, security, privacy, or operator implications.
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and pull requests.
          required: true
        - label: I omitted hostnames, home paths, and other private environment details.
          required: true
        - label: Game rules stay in hoshi-core, or this explains why the boundary should change.
          required: true
        - label: I checked docs/realism.md (physics and maths, domain model, simplifications).
          required: true
