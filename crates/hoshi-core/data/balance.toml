# Economy, raid, activity, expedition, flight and pacing.
# Loaded and validated by hoshi-core on BalanceConfig::default().
# Research and ships stay in research.toml and ships.toml.
# Planet defences stay in defences.toml.

version = 1

[pacing]
# First building upgrade must complete within this many seconds.
first_upgrade_secs = 300
# Metal mine levels gained per simulated day (greedy strategy).
min_metal_mine_per_day = 1
# metal(with max PR-merge pulses) / metal(activity off) must stay at or below this.
max_bridge_metal_ratio = 8.0

[self_play]
# Opt-in CI / CLI matrix. Never runs during normal play.
# Fail when a species or path is more than this fraction faster than the median.
dominance_max = 0.25
# Fail when one species takes more than this share of fastest finishes (nightly, ≥3 seeds).
win_share_max = 0.55
pr_seeds = [1]
nightly_seeds = [1, 2, 3, 5, 8]
curve_days = 3

