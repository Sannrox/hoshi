# Industrial goal ladder. Tiers complete from sustained production rates
# (goods per hour and energy supply), never from a one-off stockpile.
# hold_secs = 0 means the current rate is the evidence. Each tier needs
# higher building levels than the last (roughly deuterium synthesizer 1,
# metal and crystal mines 4, metal mine 8, deuterium synthesizer 10, then
# metal mine 12), so tiers never complete together.

hold_secs = 0

[[tier]]
id = "water_propellant"
name = "Self-sufficient volatiles"
blurb = "Keep water ice extraction and propellant refining running."
goods = { water_ice = 0.2, propellant = 0.05 }
reward_metal = 300.0
reward_crystal = 100.0
reward_deuterium = 0.0

