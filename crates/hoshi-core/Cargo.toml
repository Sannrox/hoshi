[package]
description = "Game rules, state, timers and offline progression for hoshi."
name = "hoshi-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
default = []
commentary-model = []
advisor-model = ["commentary-model"]

[dependencies]
serde = { version = "1.0.229", default-features = false, features = ["derive", "std"] }
# Exact f64 round trips: host bytes such as `ShardCommons` must restore
# the same prices a host that never stopped holds.
serde_json = { version = "1.0.152", features = ["float_roundtrip"] }
toml = { version = "1.1.8", default-features = false, features = ["parse", "serde"] }
hmac = "0.12"
sha2 = "0.10"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
