[package]
description = "Game rules, state, timers and offline progression for hoshi."
name = "hoshi-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = []
commentary-model = []
advisor-model = ["commentary-model"]
mikura = ["dep:mikura"]

[dependencies]
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
toml = { version = "1.1.8", features = ["parse"] }
mikura = { git = "https://github.com/Sannrox/mikura", tag = "v0.2.0", optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
