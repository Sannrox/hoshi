[package]
description = "Game rules, state, timers and offline progression for hoshi."
name = "hoshi-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
default = []
commentary-model = []
advisor-model = ["commentary-model"]

[dependencies]
serde = { version = "1.0.229", default-features = false, features = ["derive", "std"] }
serde_json = "1.0.152"
toml = { version = "1.1.8", default-features = false, features = ["parse", "serde"] }
hmac = "0.12"
sha2 = "0.10"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
