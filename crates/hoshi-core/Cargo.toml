[package]
description = "Game rules, state, timers and offline progression for hoshi."
name = "hoshi-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
default = []
commentary-model = []
advisor-model = ["commentary-model"]
mikura = ["dep:mikura"]
chisei = []

[dependencies]
rusqlite = { version = "0.37", features = ["bundled", "serialize"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.152"
toml = { version = "1.1.8", features = ["parse"] }
mikura = { version = "0.2.0", git = "https://github.com/Sannrox/mikura", tag = "v0.2.0", optional = true }
hmac = "0.12"
sha2 = "0.10"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
