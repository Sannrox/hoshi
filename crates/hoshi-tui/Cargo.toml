[package]
description = "Terminal UI for hoshi, an idle space-strategy game."
name = "hoshi-tui"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = []
bridge = ["dep:hoshi-bridge"]
commentary-model = ["hoshi-core/commentary-model"]

[dependencies]
hoshi-core = { path = "../hoshi-core" }
hoshi-bridge = { path = "../hoshi-bridge", optional = true }
ratatui = "0.29"
serde_json = "1.0.152"

[dev-dependencies]
hoshi-core = { path = "../hoshi-core" }

[[bin]]
name = "hoshi"
path = "src/main.rs"
