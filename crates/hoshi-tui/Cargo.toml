[package]
description = "Idle space-strategy game for the terminal."
name = "hoshi"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = true
readme = "../../README.md"
keywords = ["game", "tui", "idle"]
categories = ["games", "command-line-utilities"]

[features]
default = []
bridge = ["dep:hoshi-bridge"]
commentary-model = ["hoshi-core/commentary-model"]
advisor-model = ["hoshi-core/advisor-model"]
mikura = ["hoshi-core/mikura"]
chisei = ["hoshi-core/chisei"]

[dependencies]
hoshi-core = { workspace = true }
hoshi-bridge = { workspace = true, optional = true }
ratatui = "0.29"
serde_json = "1.0.152"
getrandom = "0.2"
sha1 = "0.10"
sha2 = "0.10"
serde = { version = "1.0.229", features = ["derive"] }
ed25519-dalek = "2.2"
atomicwrites = "0.4"
fs2 = "0.4"
semver = "1.0"
pulldown-cmark = { version = "0.13", default-features = false }
toml = { version = "1.1.8", features = ["parse"] }
regex = "1"
flate2 = "1"
tar = "0.4"

[dev-dependencies]
hoshi-core = { workspace = true }

[[bin]]
name = "hoshi"
path = "src/main.rs"
